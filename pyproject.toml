[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandwidth-manager"
version = "0.1.0"
description = "Bandwidth monitor, allocator, QoS, and control-plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6",
    "uvicorn>=0.32",
]

[project.scripts]
bw-monitor = "bandwidth_manager.monitoring.cli:main"
bw-api = "bandwidth_manager.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
